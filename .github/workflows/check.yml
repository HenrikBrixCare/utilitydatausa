name: UtilityDataUSA checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check authoritative public sources
        run: node scripts/source-smoke.mjs
